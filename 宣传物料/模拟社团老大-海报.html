<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模拟社团老大｜宣传海报</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1024px; height: 1536px; overflow: hidden; }
    body {
      background: #070d0c;
      color: #f5f0e5;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
    }
    .poster {
      position: relative;
      width: 1024px;
      height: 1536px;
      overflow: hidden;
      isolation: isolate;
      background: #070d0c url("./模拟社团老大-海报底图-imagegen.png") center / cover no-repeat;
    }
    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(2, 8, 8, .72) 0, rgba(3, 10, 10, .13) 22%, rgba(3, 9, 9, 0) 52%, rgba(3, 8, 8, .12) 63%, rgba(3, 6, 6, .74) 100%),
        linear-gradient(90deg, rgba(2, 8, 8, .5), transparent 35%, transparent 70%, rgba(2, 8, 8, .28));
    }
    .top-rule {
      position: absolute;
      top: 54px;
      left: 70px;
      right: 70px;
      height: 1px;
      background: linear-gradient(90deg, #a87632, rgba(202, 169, 98, .2), transparent);
    }
    .seal {
      position: absolute;
      top: 79px;
      left: 70px;
      width: 94px;
      height: 112px;
      border: 1px solid #d0a95b;
      background: rgba(104, 24, 25, .9);
      box-shadow: 0 0 0 7px rgba(59, 14, 14, .5), 0 14px 38px rgba(0, 0, 0, .4);
      display: grid;
      place-items: center;
      color: #f4e5c4;
      font: 700 25px/1.25 "STKaiti", "Kaiti SC", serif;
      letter-spacing: .2em;
      writing-mode: vertical-rl;
    }
    .masthead {
      position: absolute;
      top: 76px;
      left: 205px;
      right: 70px;
      text-shadow: 0 3px 20px #000, 0 1px 4px #000;
    }
    .eyebrow {
      color: #d5ad61;
      font: 600 17px/1.2 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: 72px;
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .subtitle {
      margin: 0;
      color: #e4dfd3;
      font-size: 24px;
      line-height: 1.55;
      letter-spacing: .08em;
    }
    .chapter {
      position: absolute;
      top: 300px;
      right: 72px;
      padding: 10px 16px;
      border-left: 3px solid #8c2728;
      background: rgba(5, 12, 12, .62);
      color: #d7c39d;
      font: 600 17px/1.25 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: .16em;
    }
    .bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 579px;
      padding: 58px 65px 50px;
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 46px;
      background: linear-gradient(180deg, rgba(13, 14, 14, .08), rgba(7, 10, 10, .34));
    }
    .bottom::before {
      content: "";
      position: absolute;
      top: 0;
      left: 65px;
      right: 65px;
      height: 1px;
      background: linear-gradient(90deg, #b78943, rgba(183, 137, 67, .45), transparent);
    }
    .pitch { padding-top: 7px; }
    .kicker {
      color: #d7ac59;
      font: 700 18px/1.2 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: .22em;
    }
    .hook {
      margin: 18px 0 22px;
      font-size: 43px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: .03em;
    }
    .body-copy {
      margin: 0;
      max-width: 525px;
      color: #d7d4ca;
      font: 400 22px/1.8 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: .035em;
    }
    .mechanics {
      display: flex;
      gap: 11px;
      margin-top: 30px;
      font: 650 17px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    .mechanics span {
      padding: 11px 15px;
      border: 1px solid rgba(204, 168, 98, .42);
      background: rgba(7, 17, 16, .56);
      color: #e3cfaa;
    }
    .cta {
      margin-top: 29px;
      display: inline-block;
      padding: 13px 20px;
      border-left: 5px solid #bd8a3d;
      background: #731f22;
      color: #fff3da;
      font: 700 22px/1.3 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: .06em;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .25);
    }
    .qr-wrap {
      align-self: end;
      text-align: center;
      transform: translateY(-4px);
    }
    .qr-label {
      margin-bottom: 14px;
      color: #f3e6ca;
      font: 700 23px/1.3 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: .1em;
    }
    .qr-frame {
      width: 310px;
      height: 310px;
      padding: 14px;
      border: 2px solid #c59a51;
      background: #fff;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .45);
    }
    .qr-frame img { display: block; width: 278px; height: 278px; image-rendering: pixelated; }
    .url {
      margin-top: 13px;
      color: #a7aaa3;
      font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .fiction {
      position: absolute;
      left: 66px;
      bottom: 18px;
      color: #777e78;
      font: 400 12px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="模拟社团老大游戏宣传海报">
    <div class="top-rule"></div>
    <div class="seal">雾港和联胜</div>
    <header class="masthead">
      <div class="eyebrow">HARBOR / 001 · 雾港风云</div>
      <h1>模拟社团老大</h1>
      <p class="subtitle">父亲留下的不是王座，是一条老街、三名旧部，<br>和一本没还完的账。</p>
    </header>
    <div class="chapter">架空剧情策略游戏</div>

    <section class="bottom">
      <div class="pitch">
        <div class="kicker">接班不是结局，是第一场硬仗</div>
        <div class="hook">从一条老街开始，<br>一步步坐上主位。</div>
        <p class="body-copy">招人、抢地、谈判、血拼。地盘越打越大，人心却越来越难管——雾港只能有一个话事人。</p>
        <div class="mechanics"><span>招人</span><span>抢地</span><span>血拼</span><span>一统雾港</span></div>
        <div class="cta">扫码开局｜这一次，轮到你坐主位</div>
      </div>
      <div class="qr-wrap">
        <div class="qr-label">扫码直接开玩</div>
        <div class="qr-frame"><img src="./模拟社团老大-游戏二维码.png" alt="游戏二维码"></div>
        <div class="url">lynch715.github.io/triad-boss-simulator/</div>
      </div>
    </section>
    <div class="fiction">本游戏为架空虚构作品 · 本地存档 · 无数据上传</div>
  </main>
</body>
</html>
